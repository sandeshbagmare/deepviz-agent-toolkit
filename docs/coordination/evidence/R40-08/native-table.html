<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; script-src &#39;nonce-defaf3bd96db27849badec4e89418686&#39; &#39;self&#39; ; style-src &#39;unsafe-inline&#39;; img-src data:; font-src &#39;self&#39;; connect-src &#39;none&#39;; base-uri &#39;none&#39;; form-action &#39;none&#39;"><title>Visualization</title><style>body{font:14px system-ui,sans-serif;margin:24px;background:#fff;color:#1f2937}h1{font-size:24px}h2{font-size:18px}.dashboard{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:24px}section{min-width:0}.chart{overflow:auto}svg{max-width:none;height:auto}.table-scroll{overflow:auto;max-height:600px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #9ca3af;padding:6px 10px;text-align:left}summary{cursor:pointer}@media(max-width:800px){.dashboard{grid-template-columns:1fr}}</style></head><body><h1>Visualization</h1><main class="dashboard"><section aria-labelledby="heading-0"><h2 id="heading-0">Visualization</h2><div class="chart" id="chart-0" style="min-height:520px"><div class="table-scroll"><table><thead><tr><th scope="col">x</th><th scope="col">y</th></tr></thead><tbody><tr><td>&lt;img src=x onerror=alert(1)&gt;</td><td>2</td></tr></tbody></table></div></div></section></main><script nonce="defaf3bd96db27849badec4e89418686">(async()=>{const charts=[{"id":"chart-0","engine":"svg","spec":{"html":"\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003ex\u003c/th\u003e\u003cth scope=\"col\"\u003ey\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u0026lt;img src=x onerror=alert(1)\u0026gt;\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e"},"kind":"table"}];globalThis.deepvizReady=false;globalThis.deepvizErrors=[];for(const chart of charts){if(chart.kind==='table'||chart.engine==='svg')continue;try{const el=document.getElementById(chart.id);if(chart.engine==='vega'){await vegaEmbed(el,chart.spec,{actions:false,renderer:'svg',tooltip:false});}else if(chart.engine==='echarts'){echarts.init(el).setOption(chart.spec);}else if(chart.engine==='antv'){const view=new G2.Chart({container:el});view.options(chart.spec);await view.render();}else if(chart.engine==='plotly'){await Plotly.newPlot(el,chart.spec.data,chart.spec.layout,chart.spec.config);}}catch(error){const message=String(error);globalThis.deepvizErrors.push(message);document.getElementById(chart.id).textContent='Chart failed: '+message;}}globalThis.deepvizReady=true;})();</script></body></html>
