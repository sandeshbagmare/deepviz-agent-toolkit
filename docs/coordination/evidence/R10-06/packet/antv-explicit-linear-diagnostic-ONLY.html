<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negative linear scale control</title><style>body{background:#ffffff;color:#202938;font:14px system-ui;margin:20px}main{max-width:900px;display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:20px}section{min-width:0}p,h1,h2,td,th{overflow-wrap:anywhere}summary{cursor:pointer;padding:8px}.data-scroll{overflow:auto;max-height:28rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #7a8494;padding:6px;text-align:left}caption{text-align:left;font-weight:600;padding:8px}summary:focus-visible{outline:3px solid #2a9d73;outline-offset:2px}@media(max-width:650px){main{grid-template-columns:1fr}}</style></head><body><h1>Negative linear scale control</h1><main><section><h2>Negative linear scale control</h2><div id="chart-0" role="img" aria-label="Negative linear scale control" aria-describedby="chart-summary-0" style="width:100%;height:520px;background:#ffffff"></div><p id="chart-summary-0">heatmap chart. 2 displayed records from 2 input records. Reduction strategy: none. </p><ul><li>Diagnostic-only scale override</li></ul><details><summary>View chart data (2 records)</summary><div class="data-scroll"><table><caption>Data for Negative linear scale control</caption><thead><tr><th scope="col">day</th><th scope="col">slot</th><th scope="col">z</th></tr></thead><tbody><tr><td>Mon</td><td>AM</td><td>-7</td></tr><tr><td>Tue</td><td>PM</td><td>-2</td></tr></tbody></table></div></details></section></main><script id="deepviz-data" type="application/json">[{"type":"cell","data":[{"_x":"Mon","_y":"AM","_color":"-7","_size":8,"_heat":-7.0,"_row":0},{"_x":"Tue","_y":"PM","_color":"-2","_size":8,"_heat":-2.0,"_row":1}],"encode":{"x":"_x","y":"_y","color":"_heat"},"animate":false,"theme":"light","title":"Negative linear scale control","tooltip":false,"axis":{"x":{"title":"day","labelFill":"#202938","titleFill":"#202938"},"y":{"title":"slot","labelFill":"#202938","titleFill":"#202938"}},"scale":{"color":{"type":"linear","domain":[-7,-2],"range":["#2166ac","#b2182b"]}}}]</script><script src="https://cdn.jsdelivr.net/npm/@antv/g2@5.4.8/dist/g2.min.js"></script><script>const payloads=JSON.parse(document.getElementById("deepviz-data").textContent);window.deepvizReady=Promise.all(payloads.map((p,i)=>{const el=document.getElementById("chart-"+i);const c=new G2.Chart({container:el,width:el.clientWidth,height:el.clientHeight});c.options(p);return c.render();})).catch(e=>{document.body.dataset.renderError=String(e);throw e;});</script></body></html>
