[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepviz-agent-toolkit"
version = "0.1.0"
description = "Schema-driven data normalization foundation for DeepViz"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "numpy>=1.26", "matplotlib>=3.9", "plotly>=6,<7", "vl-convert-python>=1.7"]

[project.optional-dependencies]
agents = ["deepagents>=0.3", "langchain-core>=1,<2"]
mcp = ["mcp>=1.12,<2"]
columnar = ["pyarrow>=19"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "twine>=6", "pillow>=11", "jsonschema>=4.23", "httpx>=0.28"]

[tool.hatch.build.targets.wheel]
packages = ["python/deepviz/src/deepviz"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/chart-spec.schema.json" = "deepviz/resources/chart-spec.schema.json"
"prompts/v1" = "deepviz/resources/prompts/v1"

[tool.pytest.ini_options]
testpaths = ["python/deepviz/tests", "tests"]
markers = ["scale: large dataset benchmark", "integration: external adapter integrations"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["python/deepviz/src/deepviz"]
